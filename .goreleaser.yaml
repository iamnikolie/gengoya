version: 2

project_name: gengoya

before:
  hooks:
    - go mod tidy

builds:
  - id: gengoya
    binary: gengoya
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/iamnikolie/gengoya/cmd.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request

release:
  draft: false
  prerelease: auto

# Formula in iamnikolie/homebrew-tap, rewritten on every tag. Needs the
# HOMEBREW_TAP_TOKEN secret (fine-grained, contents:write on homebrew-tap only).
brews:
  - name: gengoya
    repository:
      owner: iamnikolie
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: Mykola Klitovchenko
      email: mykola.klitovchenko@gmail.com
    commit_msg_template: "{{ .ProjectName }} {{ .Version }}"
    homepage: https://github.com/iamnikolie/gengoya
    description: "Image, video, music and speech generation CLI for coding agents"
    license: MIT
    skip_upload: auto
    caveats: |
      Video poster frames (the PNG contact sheet next to each clip) need ffmpeg:
      brew install ffmpeg
    install: |
      bin.install "gengoya"
    test: |
      assert_match(/^gengoya version /, shell_output("#{bin}/gengoya version"))
